name: Update Exchange Rates & Core Assets (Official APIs Only)

on:
  schedule:
    - cron: '3,23,43 * * * *' # 매시 03분(OER 200통화·귀금속 + ETH), 23분·43분(TwelveData 16통화 실시간·등락률)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch FX, metals, core crypto & 3-year history
        env:
          OER_APP_ID: ${{ secrets.OER_APP_ID }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node << 'EOF'
          const fs = require("fs");

          // 타임아웃 및 자동 리다이렉트 지원 공식 API 호출 헬퍼
          async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const res = await fetch(url, { signal: controller.signal, redirect: "follow" });
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              return null;
            } finally {
              clearTimeout(timer);
            }
          }

          // 이상치 방어 병합 (일반 통화 ±25%, 암호화폐 ±60%)
          function safeMergeRates(baseRates, incomingRates, allowLargeJump = false, maxSwing = 0.25) {
            const merged = { ...baseRates };
            for (const [cur, val] of Object.entries(incomingRates)) {
              const num = Number(val);
              if (!Number.isFinite(num) || num <= 0) continue;
              const prev = merged[cur];
              if (!allowLargeJump && prev > 0) {
                const ratio = num / prev;
                if (ratio > 1 + maxSwing || ratio < 1 - maxSwing) continue;
              }
              merged[cur] = num;
            }
            return merged;
          }

          // [1순위 공식 API] OpenExchangeRates (200개 통화 + 금 XAU + 은 XAG + 백금 XPT + 팔라듐 XPD + BTC)
          async function fetchOER() {
            if (!process.env.OER_APP_ID) return null;
            const data = await fetchJsonWithTimeout(
              `https://openexchangerates.org/api/latest.json?app_id=${process.env.OER_APP_ID}`
            );
            if (data?.rates?.KRW > 0 && data?.rates?.JPY > 0) {
              return { source: "1-OpenExchangeRates", rates: data.rates };
            }
            return null;
          }

          // [2~4순위 무가입 공식/오픈 백업] 24시간 주기
          async function fetchKeylessFallback() {
            const er = await fetchJsonWithTimeout("https://open.er-api.com/v6/latest/USD");
            if (er?.rates?.KRW > 0 && er?.rates?.JPY > 0) {
              return { source: "2-ER-API", rates: er.rates };
            }

            const fawaz = await fetchJsonWithTimeout(
              "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json"
            );
            if (fawaz?.usd?.krw > 0) {
              const rates = {};
              for (const [k, v] of Object.entries(fawaz.usd)) {
                rates[k.toUpperCase()] = v;
              }
              return { source: "3-Fawazahmed0-CDN", rates };
            }

            const ecb = await fetchJsonWithTimeout("https://api.frankfurter.dev/v1/latest?base=USD");
            if (ecb?.rates?.KRW > 0) {
              return { source: "4-ECB-Frankfurter", rates: { USD: 1, ...ecb.rates } };
            }

            return null;
          }

          // [오픈 CDN] 대표 암호화폐 보충 (이더리움 ETH 및 BTC 백업)
          async function fetchCoreCrypto() {
            const fawaz = await fetchJsonWithTimeout(
              "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json",
              8000
            );
            if (!fawaz?.usd) return {};
            const result = {};
            for (const sym of ["BTC", "ETH"]) {
              const val = Number(fawaz.usd[sym.toLowerCase()]);
              if (Number.isFinite(val) && val > 0) result[sym] = val;
            }
            return result;
          }

          // [공식 API] Twelve Data /quote 8개씩 분할 호출 (핵심 16개 통화 실시간 시세 + 전일대비 등락률)
          async function fetchTwelveDataQuoteBatch(pairs) {
            const url = `https://api.twelvedata.com/quote?symbol=${pairs.join(",")}&apikey=${process.env.TWELVE_DATA_KEY}`;
            const td = await fetchJsonWithTimeout(url, 10000);
            const rates = {};
            const quotes = {};
            if (!td) return { rates, quotes };

            for (const pair of pairs) {
              const item = td?.[pair];
              const price = parseFloat(item?.close || item?.price);
              if (price && price > 0) {
                const cur = pair.split("/")[1];
                rates[cur] = price;

                const prevClose = parseFloat(item?.previous_close);
                const change = parseFloat(item?.change);
                const pct = parseFloat(item?.percent_change);
                const high = parseFloat(item?.high);
                const low = parseFloat(item?.low);

                quotes[cur] = {
                  price,
                  previous_close: Number.isFinite(prevClose) && prevClose > 0 ? prevClose : null,
                  change: Number.isFinite(change) ? change : null,
                  percent_change: Number.isFinite(pct) ? Number(pct.toFixed(4)) : null,
                  high: Number.isFinite(high) && high > 0 ? high : null,
                  low: Number.isFinite(low) && low > 0 ? low : null
                };
              }
            }
            return { rates, quotes };
          }

          // [공식 ECB 데이터] 3년 치 과거 환율 수집
          async function fetchHistory3Y() {
            const end = new Date();
            const start = new Date();
            start.setFullYear(end.getFullYear() - 3);
            const startStr = start.toISOString().slice(0, 10);
            const endStr = end.toISOString().slice(0, 10);

            const urls = [
              `https://api.frankfurter.dev/v1/${startStr}..${endStr}?base=USD`,
              `https://api.frankfurter.app/${startStr}..${endStr}?from=USD`
            ];

            for (const url of urls) {
              const data = await fetchJsonWithTimeout(url, 15000);
              if (data?.rates && Object.keys(data.rates).length > 100) {
                fs.writeFileSync("history_3y.json", JSON.stringify(data));
                return true;
              }
            }
            return false;
          }

          async function run() {
            const now = new Date();
            const nowMs = now.getTime();
            const isWeekend = now.getUTCDay() === 0 || now.getUTCDay() === 6;
            const isManual = process.env.EVENT_NAME === "workflow_dispatch";

            let existing = null;
            if (fs.existsSync("latest.json")) {
              try {
                existing = JSON.parse(fs.readFileSync("latest.json", "utf8"));
              } catch (e) {}
            }

            const existingRates = existing?.rates || {};
            let updatedQuotes = { ...(existing?.quotes || {}) };

            const lastOerMs = existing?.meta?.last_oer_at ? Date.parse(existing.meta.last_oer_at) : 0;
            const lastTdMs = existing?.meta?.last_td_at ? Date.parse(existing.meta.last_td_at) : 0;
            const minsSinceOer = (nowMs - lastOerMs) / 60000;
            const minsSinceTd = (nowMs - lastTdMs) / 60000;
            const isExistingFresh24h = existing?.updated_at_iso && (nowMs - Date.parse(existing.updated_at_iso)) < 24 * 3600 * 1000;

            let updatedRates = { ...existingRates };
            // 이전 테스트에서 남아있을 수 있는 지수 항목 정리
            delete updatedRates.SPX;
            delete updatedRates.NDX;
            delete updatedQuotes.SPX;
            delete updatedQuotes.NDX;

            let baseSource = existing?.base_source || "init";
            let realtimeSource = existing?.realtime_source || null;
            let newLastOerAt = existing?.meta?.last_oer_at || null;
            let newLastTdAt = existing?.meta?.last_td_at || null;
            let didUpdate = false;

            // [슬롯 A: 매시 03분] 공식 API로 200개 통화 + 귀금속(XAU, XAG) + BTC/ETH 갱신
            if (isManual || !existing || minsSinceOer >= 50) {
              const oer = await fetchOER();
              if (oer) {
                updatedRates = safeMergeRates(updatedRates, oer.rates, !existing, 0.25);
                baseSource = oer.source;
                newLastOerAt = now.toISOString();
                didUpdate = true;
              } else if (!isExistingFresh24h) {
                const fb = await fetchKeylessFallback();
                if (fb) {
                  updatedRates = safeMergeRates(updatedRates, fb.rates, !existing, 0.25);
                  baseSource = fb.source;
                  didUpdate = true;
                }
              }

              // 이더리움(ETH) 및 BTC 백업 병합
              const cryptoRates = await fetchCoreCrypto();
              if (oer?.rates?.BTC > 0) delete cryptoRates.BTC;
              if (Object.keys(cryptoRates).length > 0) {
                updatedRates = safeMergeRates(updatedRates, cryptoRates, !existing, 0.60);
                didUpdate = true;
              }
            }

            // [슬롯 B: 매시 23분, 43분] 평일 실시간 16개 핵심 통화 시세 + 등락률 덮어쓰기
            const shouldRunTd = process.env.TWELVE_DATA_KEY && !isWeekend && (isManual || (minsSinceOer >= 12 && minsSinceTd >= 15));
            if (shouldRunTd) {
              const batch1 = ["USD/KRW", "USD/IDR", "USD/JPY", "USD/EUR", "USD/VND", "USD/THB", "USD/CNY", "USD/SGD"];
              const batch2 = ["USD/TWD", "USD/PHP", "USD/MYR", "USD/HKD", "USD/GBP", "USD/AUD", "USD/CAD", "USD/CHF"];

              const r1 = await fetchTwelveDataQuoteBatch(batch1);
              await new Promise(resolve => setTimeout(resolve, 65000)); // 분당 8크레딧 제한 초기화 대기
              const r2 = await fetchTwelveDataQuoteBatch(batch2);

              const mergedTdRates = { ...r1.rates, ...r2.rates };
              const mergedTdQuotes = { ...r1.quotes, ...r2.quotes };
              const tdCount = Object.keys(mergedTdRates).length;

              if (tdCount > 0) {
                updatedRates = safeMergeRates(updatedRates, mergedTdRates, false, 0.25);
                updatedQuotes = { ...updatedQuotes, ...mergedTdQuotes };
                realtimeSource = `TwelveData-20m-Quote(${tdCount})`;
                newLastTdAt = now.toISOString();
                didUpdate = true;
              }
            }

            // 3년 치 과거 차트 데이터 (파일이 없거나, 수동 실행이거나, 매일 UTC 00시 03분대일 때)
            const hasHistory = fs.existsSync("history_3y.json");
            const isDailyHistorySlot = now.getUTCHours() === 0 && now.getUTCMinutes() < 20;
            if (!hasHistory || isManual || isDailyHistorySlot) {
              const historyOk = await fetchHistory3Y();
              if (historyOk) didUpdate = true;
            }

            if (!didUpdate && existing) {
              console.log("새로운 시세 갱신 대상 없음 - 기존 최신 파일을 그대로 유지합니다.");
              process.exit(0);
            }

            // 최종 무결성 검증
            if (updatedRates.KRW > 0 && updatedRates.JPY > 0 && Object.keys(updatedRates).length >= 20) {
              const payload = {
                base: "USD",
                base_source: baseSource,
                realtime_source: realtimeSource,
                updated_at_iso: now.toISOString(),
                meta: {
                  last_oer_at: newLastOerAt,
                  last_td_at: newLastTdAt
                },
                rates: updatedRates,
                quotes: updatedQuotes
              };
              fs.writeFileSync("latest.json", JSON.stringify(payload));
              console.log("latest.json 저장 완료 (총 항목:", Object.keys(updatedRates).length, "개)");
            } else {
              console.error("데이터 검증 실패 - 기존 파일 보호");
              process.exit(1);
            }
          }

          run();
          EOF

      - name: Commit and push data files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if [ -f "history_3y.json" ]; then git add history_3y.json; fi
          if ! git diff --cached --quiet; then
            LAST_AUTHOR=$(git log -1 --pretty=%an)
            if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
              git commit --amend -m "chore: update rates $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push --force
            else
              git commit -m "chore: update rates $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push
            fi
          fi

      - name: Purge jsDelivr CDN cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/latest.json" > /dev/null
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/history_3y.json" > /dev/null
