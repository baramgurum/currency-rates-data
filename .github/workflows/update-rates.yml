name: Update Exchange Rates (3x Hourly Staggered + Anti-Stale)

on:
  schedule:
    - cron: '3,23,43 * * * *' # 매시 03분(OER 200통화), 23분·43분(TwelveData 16통화) = 시간당 3회 갱신
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch staggered rates & 3-year history
        env:
          OER_APP_ID: ${{ secrets.OER_APP_ID }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node << 'EOF'
          const fs = require("fs");

          // 타임아웃 및 자동 리다이렉트 지원 fetch 헬퍼
          async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const res = await fetch(url, { signal: controller.signal, redirect: "follow" });
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              return null;
            } finally {
              clearTimeout(timer);
            }
          }

          // 이상치(±25% 급변 오류) 방어 병합
          function safeMergeRates(baseRates, incomingRates, allowLargeJump = false) {
            const merged = { ...baseRates };
            for (const [cur, val] of Object.entries(incomingRates)) {
              const num = Number(val);
              if (!Number.isFinite(num) || num <= 0) continue;
              const prev = merged[cur];
              if (!allowLargeJump && prev > 0) {
                const ratio = num / prev;
                if (ratio > 1.25 || ratio < 0.75) continue;
              }
              merged[cur] = num;
            }
            return merged;
          }

          // [1순위] OpenExchangeRates (1시간 주기 · 200개 전체 통화)
          async function fetchOER() {
            if (!process.env.OER_APP_ID) return null;
            const data = await fetchJsonWithTimeout(
              `https://openexchangerates.org/api/latest.json?app_id=${process.env.OER_APP_ID}`
            );
            if (data?.rates?.KRW > 0 && data?.rates?.JPY > 0) {
              return { source: "1-OpenExchangeRates", rates: data.rates };
            }
            return null;
          }

          // [2~4순위 무가입 백업] 24시간 주기
          async function fetchKeylessFallback() {
            const er = await fetchJsonWithTimeout("https://open.er-api.com/v6/latest/USD");
            if (er?.rates?.KRW > 0 && er?.rates?.JPY > 0) {
              return { source: "2-ER-API", rates: er.rates };
            }

            const fawaz = await fetchJsonWithTimeout(
              "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json"
            );
            if (fawaz?.usd?.krw > 0) {
              const rates = {};
              for (const [k, v] of Object.entries(fawaz.usd)) {
                rates[k.toUpperCase()] = v;
              }
              return { source: "3-Fawazahmed0-CDN", rates };
            }

            const ecb = await fetchJsonWithTimeout("https://api.frankfurter.dev/v1/latest?base=USD");
            if (ecb?.rates?.KRW > 0) {
              return { source: "4-ECB-Frankfurter", rates: { USD: 1, ...ecb.rates } };
            }

            return null;
          }

          // Twelve Data 8개씩 분할 호출
          async function fetchTwelveDataBatch(pairs) {
            const url = `https://api.twelvedata.com/price?symbol=${pairs.join(",")}&apikey=${process.env.TWELVE_DATA_KEY}`;
            const td = await fetchJsonWithTimeout(url, 8000);
            const result = {};
            if (!td) return result;

            for (const pair of pairs) {
              const price = parseFloat(td?.[pair]?.price);
              if (price && price > 0) {
                result[pair.split("/")[1]] = price;
              }
            }
            return result;
          }

          // 3년 치 과거 환율 수집 (신규 frankfurter.dev 및 구 frankfurter.app 2중 호출)
          async function fetchHistory3Y() {
            const end = new Date();
            const start = new Date();
            start.setFullYear(end.getFullYear() - 3);
            const startStr = start.toISOString().slice(0, 10);
            const endStr = end.toISOString().slice(0, 10);

            const urls = [
              `https://api.frankfurter.dev/v1/${startStr}..${endStr}?base=USD`,
              `https://api.frankfurter.app/${startStr}..${endStr}?from=USD`
            ];

            for (const url of urls) {
              const data = await fetchJsonWithTimeout(url, 15000);
              if (data?.rates && Object.keys(data.rates).length > 100) {
                fs.writeFileSync("history_3y.json", JSON.stringify(data));
                console.log("history_3y.json 생성 완료:", Object.keys(data.rates).length, "일치 데이터");
                return true;
              }
            }
            console.warn("history_3y.json 수집 실패 - 다음 주기에 재시도합니다.");
            return false;
          }

          async function run() {
            const now = new Date();
            const nowMs = now.getTime();
            const isWeekend = now.getUTCDay() === 0 || now.getUTCDay() === 6;
            const isManual = process.env.EVENT_NAME === "workflow_dispatch";

            let existing = null;
            if (fs.existsSync("latest.json")) {
              try {
                existing = JSON.parse(fs.readFileSync("latest.json", "utf8"));
              } catch (e) {}
            }

            const existingRates = existing?.rates || {};
            const lastOerMs = existing?.meta?.last_oer_at ? Date.parse(existing.meta.last_oer_at) : 0;
            const lastTdMs = existing?.meta?.last_td_at ? Date.parse(existing.meta.last_td_at) : 0;
            const minsSinceOer = (nowMs - lastOerMs) / 60000;
            const minsSinceTd = (nowMs - lastTdMs) / 60000;
            const isExistingFresh24h = existing?.updated_at_iso && (nowMs - Date.parse(existing.updated_at_iso)) < 24 * 3600 * 1000;

            let updatedRates = { ...existingRates };
            let baseSource = existing?.base_source || "init";
            let realtimeSource = existing?.realtime_source || null;
            let newLastOerAt = existing?.meta?.last_oer_at || null;
            let newLastTdAt = existing?.meta?.last_td_at || null;
            let didUpdate = false;

            // [슬롯 A: 매시 03분] OER 200개 통화 베이스 갱신
            if (isManual || !existing || minsSinceOer >= 50) {
              const oer = await fetchOER();
              if (oer) {
                updatedRates = safeMergeRates(updatedRates, oer.rates, !existing);
                baseSource = oer.source;
                newLastOerAt = now.toISOString();
                didUpdate = true;
              } else if (!isExistingFresh24h) {
                const fb = await fetchKeylessFallback();
                if (fb) {
                  updatedRates = safeMergeRates(updatedRates, fb.rates, !existing);
                  baseSource = fb.source;
                  didUpdate = true;
                }
              }
            }

            // [슬롯 B: 매시 23분, 43분] 평일 실시간 16개 핵심 통화 덮어쓰기
            const shouldRunTd = process.env.TWELVE_DATA_KEY && !isWeekend && (isManual || (minsSinceOer >= 12 && minsSinceTd >= 15));
            if (shouldRunTd) {
              const batch1 = ["USD/KRW", "USD/IDR", "USD/JPY", "USD/EUR", "USD/VND", "USD/THB", "USD/CNY", "USD/SGD"];
              const batch2 = ["USD/TWD", "USD/PHP", "USD/MYR", "USD/HKD", "USD/GBP", "USD/AUD", "USD/CAD", "USD/CHF"];

              const r1 = await fetchTwelveDataBatch(batch1);
              await new Promise(resolve => setTimeout(resolve, 65000));
              const r2 = await fetchTwelveDataBatch(batch2);

              const tdRates = { ...r1, ...r2 };
              const tdCount = Object.keys(tdRates).length;
              if (tdCount > 0) {
                updatedRates = safeMergeRates(updatedRates, tdRates, false);
                realtimeSource = `TwelveData-20m(${tdCount})`;
                newLastTdAt = now.toISOString();
                didUpdate = true;
              }
            }

            // 3년 치 과거 차트 데이터 (파일이 없거나, 수동 실행이거나, 매일 UTC 00시 03분대일 때)
            const hasHistory = fs.existsSync("history_3y.json");
            const isDailyHistorySlot = now.getUTCHours() === 0 && now.getUTCMinutes() < 20;
            if (!hasHistory || isManual || isDailyHistorySlot) {
              const historyOk = await fetchHistory3Y();
              if (historyOk) didUpdate = true;
            }

            if (!didUpdate && existing) {
              console.log("새로운 시세 갱신 대상 없음 - 기존 최신 파일을 그대로 유지합니다.");
              process.exit(0);
            }

            // 최종 무결성 검증
            if (updatedRates.KRW > 0 && updatedRates.JPY > 0 && Object.keys(updatedRates).length >= 20) {
              const payload = {
                base: "USD",
                base_source: baseSource,
                realtime_source: realtimeSource,
                updated_at_iso: now.toISOString(),
                meta: {
                  last_oer_at: newLastOerAt,
                  last_td_at: newLastTdAt
                },
                rates: updatedRates
              };
              fs.writeFileSync("latest.json", JSON.stringify(payload));
            } else {
              console.error("데이터 검증 실패 - 기존 파일 보호");
              process.exit(1);
            }
          }

          run();
          EOF

      - name: Overwrite commit and force push (Keep repo size under 100KB)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if [ -f "history_3y.json" ]; then git add history_3y.json; fi
          if ! git diff --cached --quiet; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
            if [ "$COMMIT_COUNT" -gt 1 ]; then
              git commit --amend -m "chore: update rates $(date -u +'%Y-%m-%d %H:%M UTC')"
            else
              git commit -m "chore: update rates $(date -u +'%Y-%m-%d %H:%M UTC')"
            fi
            git push --force
          fi

      - name: Purge jsDelivr CDN cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/latest.json" > /dev/null
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/history_3y.json" > /dev/null
